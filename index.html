<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f3">
<meta name="description" content="A clean, simple calculator.">
<title>Calc</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;font-synthesis:none;color-scheme:light;--page:#f1f1f2;--shell:#fff;--pad:#f7f7f8;--key:#f4f4f5;--key-active:#e9e9eb;--ink:#17191f;--muted:#8b8d94;--line:rgba(0,0,0,.045);--cyan:#00cfc4;--red:#f04444;--toggle:#f3f3f5;--shadow:0 28px 70px rgba(20,20,30,.10)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-width:280px;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--ink);display:grid;place-items:center;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .25s,color .25s}
body.dark{color-scheme:dark;--page:#202229;--shell:#22252d;--pad:#272a33;--key:#242730;--key-active:#333742;--ink:#f7f7f8;--muted:#858992;--line:rgba(255,255,255,.035);--toggle:#292c35;--shadow:0 28px 70px rgba(0,0,0,.24)}
.app{width:min(100vw,430px);height:min(100dvh,820px);min-height:500px;background:var(--shell);border-radius:30px;overflow:hidden;display:grid;grid-template-rows:42% 58%;box-shadow:var(--shadow);transition:background .25s}

.top{position:relative;display:flex;flex-direction:column;align-items:center;padding:28px 26px 20px;min-height:0}
.status{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:650;letter-spacing:-.02em;color:var(--ink)}
.status-right{display:flex;align-items:center;gap:4px}
.status svg{width:14px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme-switch{margin-top:12px;display:flex;align-items:center;padding:4px;gap:3px;background:var(--toggle);border-radius:16px}
.theme-switch button{width:32px;height:27px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.theme-switch button.active{color:var(--ink);background:var(--shell)}
.theme-switch svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.readout{width:100%;margin-top:auto;text-align:right;padding:0 0 4px;overflow:hidden}
.expression{min-height:23px;font-size:15px;font-weight:500;letter-spacing:.08em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.expression .op{color:var(--red);padding:0 3px}
.result{font-size:clamp(36px,10vw,43px);line-height:1.15;font-weight:650;letter-spacing:-.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.keypad{background:var(--pad);border-radius:30px 30px 0 0;padding:20px 19px 25px;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:9px;min-height:0}
.keyrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:0}
.key{border:0;border-radius:13px;background:var(--key);color:var(--ink);font-family:inherit;font-size:17px;font-weight:500;line-height:1;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0;transition:background .13s,transform .13s}
.key:active{background:var(--key-active);transform:scale(.94)}
.key:focus-visible,.theme-switch button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.key.utility{color:var(--cyan);font-size:15px;font-weight:600}
.key.operator{color:var(--red);font-size:22px;font-weight:500}
.key.equals{color:var(--red);font-size:22px;font-weight:500}
.key svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home-indicator{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:94px;height:4px;border-radius:9px;background:var(--muted);opacity:.28}
.keypad-wrap{position:relative;min-height:0}
@media(min-width:600px){.app{height:min(92dvh,790px);border-radius:30px}.top{padding-top:28px}}
@media(max-height:620px) and (min-width:601px){.app{height:100dvh;min-height:0;border-radius:0;grid-template-rows:39% 61%}.top{padding:16px 22px 12px}.keypad{padding:13px 14px 19px;gap:6px}.keyrow{gap:7px}.key{border-radius:10px}.home-indicator{bottom:7px}}
@media(max-width:360px){.app{border-radius:0}.keypad{padding-left:13px;padding-right:13px}.keyrow{gap:7px}}

/* Portrait-first mobile layout: use the entire phone screen, not a desktop card. */
@media (max-width:600px) and (orientation:portrait){
 body{display:block;width:100%;height:100%;min-height:0}
 .app{width:100%;height:100dvh;min-height:0;max-height:none;margin:0;border-radius:0;box-shadow:none;grid-template-rows:minmax(0,36%) minmax(0,64%)}
 .top{padding:calc(env(safe-area-inset-top) + 14px) 24px 14px}
 .status{font-size:11px}
 .theme-switch{margin-top:12px}
 .theme-switch button{width:36px;height:30px}
 .readout{padding-bottom:5px}
 .expression{font-size:clamp(14px,4vw,17px)}
 .result{font-size:clamp(44px,13vw,64px);line-height:1.06}
 .keypad{padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);gap:10px;border-radius:25px 25px 0 0}
 .keyrow{gap:10px}
 .key{border-radius:15px;font-size:clamp(20px,5.8vw,25px)}
 .key.utility{font-size:clamp(16px,4.4vw,19px)}
 .key.operator,.key.equals{font-size:26px}
 .key svg{width:22px;height:22px}
 .home-indicator{display:none}
}
@media (max-width:600px) and (orientation:portrait) and (max-height:650px){
 .app{grid-template-rows:minmax(0,32%) minmax(0,68%)}
 .top{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:8px}
 .theme-switch{margin-top:7px}
 .keypad{padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);gap:6px}
 .keyrow{gap:7px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="app" aria-label="Calculator">
<section class="top">
  <div class="status"><span>9:41</span><span class="status-right"><svg viewBox="0 0 18 14" aria-hidden="true"><path d="M1 12V9m4 3V6m4 6V4m4 8V2"/></svg><svg viewBox="0 0 18 14" aria-hidden="true"><path d="M2 5.5a10 10 0 0 1 14 0M5 8.5a6 6 0 0 1 8 0M8 11.5a2 2 0 0 1 2 0"/></svg><svg viewBox="0 0 18 14" aria-hidden="true"><rect x="1" y="3" width="14" height="8" rx="2"/><path d="M16 5v4"/></svg></span></div>
  <div class="theme-switch" role="group" aria-label="Appearance">
    <button id="lightMode" class="active" aria-label="Light mode" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
    <button id="darkMode" aria-label="Dark mode" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></svg></button>
  </div>
  <div class="readout"><div class="expression" id="previous" aria-live="polite"></div><div class="result" id="current">0</div></div>
</section>
<section class="keypad-wrap" aria-label="Calculator keypad">
<div class="keypad">
 <div class="keyrow"><button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="sign" aria-label="Change sign">+/−</button><button class="key utility" data-action="percent">%</button><button class="key operator" data-op="÷" aria-label="Divide"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5h.01M12 19h.01"/></svg></button></div>
 <div class="keyrow"><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×" aria-label="Multiply"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div class="keyrow"><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−" aria-label="Subtract"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
 <div class="keyrow"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
 <div class="keyrow"><button class="key" data-action="backspace" aria-label="Delete last digit"><svg viewBox="0 0 24 24"><path d="M9 5 3 12l6 7h11V5H9Z"/><path d="m12 9 6 6m0-6-6 6"/></svg></button><button class="key" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals" aria-label="Equals"><svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg></button></div>
</div><div class="home-indicator" aria-hidden="true"></div>
</section>
</main>
<script>
(()=>{
const currentEl=document.getElementById('current'),previousEl=document.getElementById('previous');
let display='0',stored=null,operator=null,waiting=false,justCalculated=false;
const pretty=v=>{if(!Number.isFinite(v))return'Error';return String(Number.parseFloat(v.toPrecision(11)))};
const format=v=>{if(v==='Error')return v;const parts=v.split('.');const sign=parts[0].startsWith('-')?'-':'';const digits=sign?parts[0].slice(1):parts[0];return sign+digits.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(parts.length>1?'.'+parts[1]:'')};
const render=()=>{currentEl.textContent=format(display)};
const renderExpression=(a,op,b='')=>{previousEl.innerHTML='';const text=document.createElement('span');text.textContent=a+' ';previousEl.append(text);const symbol=document.createElement('span');symbol.className='op';symbol.textContent=op;previousEl.append(symbol);if(b){const tail=document.createElement('span');tail.textContent=' '+b;previousEl.append(tail)}};
const inputDigit=d=>{if(display==='Error'||waiting||justCalculated){display=d;waiting=false;justCalculated=false}else if(display.replace('-','').length<14)display=display==='0'?d:display+d;render()};
const calculate=(a,b,op)=>({'+':a+b,'−':a-b,'×':a*b,'÷':b===0?NaN:a/b}[op]);
const chooseOperator=next=>{if(display==='Error')return;const value=Number(display);if(operator&&!waiting){stored=calculate(stored,value,operator);display=pretty(stored);render()}else if(stored===null||!operator)stored=value;operator=next;waiting=true;justCalculated=false;renderExpression(format(pretty(stored)),next)};
const equals=()=>{if(!operator||stored===null||waiting||display==='Error')return;const a=stored,b=Number(display),op=operator;display=pretty(calculate(a,b,op));renderExpression(format(pretty(a)),op,format(pretty(b))+' =');stored=null;operator=null;waiting=true;justCalculated=true;render()};
const clear=()=>{display='0';stored=null;operator=null;waiting=false;justCalculated=false;previousEl.textContent='';render()};
const act=a=>{if(a==='clear')return clear();if(display==='Error')return clear();if(a==='decimal'){if(waiting||justCalculated){display='0.';waiting=false;justCalculated=false}else if(!display.includes('.'))display+='.'}if(a==='sign'&&Number(display)!==0)display=display.startsWith('-')?display.slice(1):'-'+display;if(a==='percent')display=pretty(Number(display)/100);if(a==='backspace'&&!waiting&&!justCalculated){display=display.length>1?display.slice(0,-1):'0';if(display==='-')display='0'}render()};
document.querySelector('.keypad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)inputDigit(b.dataset.digit);else if(b.dataset.op)chooseOperator(b.dataset.op);else if(b.dataset.action==='equals')equals();else act(b.dataset.action)});
const setTheme=dark=>{document.body.classList.toggle('dark',dark);document.getElementById('lightMode').classList.toggle('active',!dark);document.getElementById('darkMode').classList.toggle('active',dark);document.getElementById('lightMode').setAttribute('aria-pressed',String(!dark));document.getElementById('darkMode').setAttribute('aria-pressed',String(dark));document.querySelector('meta[name="theme-color"]').content=dark?'#202229':'#f1f1f2'};
document.getElementById('lightMode').addEventListener('click',()=>setTheme(false));document.getElementById('darkMode').addEventListener('click',()=>setTheme(true));
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){inputDigit(e.key);return}const ops={'+':'+','-':'−','*':'×','/':'÷'};if(ops[e.key]){e.preventDefault();chooseOperator(ops[e.key]);return}if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();return}if(e.key==='.')act('decimal');if(e.key==='Escape')clear();if(e.key==='Backspace'){e.preventDefault();act('backspace')}if(e.key==='%')act('percent')});
render();
})();
</script>
</body>
</html>
