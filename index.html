<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪔 Diwali City – Lights & Homes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0f1e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .canvas-container {
      background: #0b0e1a;
      border-radius: 2rem;
      padding: 1rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 1.5rem;
      box-shadow: inset 0 0 30px #00000055, 0 0 30px #ffb34733;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    canvas:active {
      filter: brightness(1.2);
    }

    .caption {
      text-align: center;
      margin-top: 0.8rem;
      color: #ffd966;
      letter-spacing: 2px;
      font-weight: 400;
      text-shadow: 0 0 8px #ff9f4b;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <canvas id="diwaliCanvas" width="1000" height="600"></canvas>
    <div class="caption">🪔  HAPPY DIWALI  🪔</div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('diwaliCanvas');
      const ctx = canvas.getContext('2d');

      // ---------- dimensions ----------
      const W = canvas.width;
      const H = canvas.height;
      const GROUND_Y = H * 0.78;        // where homes & diyas sit
      const SKY_TOP = 0;

      // ---------- draw static night sky with stars ----------
      function drawSky() {
        // deep night gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        skyGrad.addColorStop(0, '#0a1128');
        skyGrad.addColorStop(0.6, '#121b33');
        skyGrad.addColorStop(1, '#1a1f2e');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, GROUND_Y + 10);

        // stars (static, small)
        ctx.fillStyle = '#fef9e7';
        for (let i = 0; i < 180; i++) {
          const x = (i * 37 + 13) % W;
          const y = (i * 19 + 7) % (GROUND_Y - 30);
          const radius = (i % 3 === 0) ? 1.8 : 1.2;
          const alpha = 0.6 + (i % 5) * 0.08;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = '#fff9e6';
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      // ---------- draw homes & buildings with glowing windows (static) ----------
      function drawHomes() {
        // ----- ground strip (dark) -----
        ctx.fillStyle = '#0e121c';
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

        // ----- row of homes / buildings -----
        // each building: [x, width, height, windowColor, hasDiyasOnRoof]
        const buildings = [
          // left cluster
          { x: 20, w: 90, h: 120, winColor: '#ffbb33', roofDiyas: true },
          { x: 125, w: 70, h: 90, winColor: '#ffaa22', roofDiyas: false },
          { x: 210, w: 110, h: 150, winColor: '#ffc857', roofDiyas: true },
          { x: 335, w: 80, h: 100, winColor: '#ffb347', roofDiyas: false },
          // middle: bigger house
          { x: 440, w: 130, h: 170, winColor: '#ffb347', roofDiyas: true },
          { x: 585, w: 70, h: 110, winColor: '#ffaa33', roofDiyas: false },
          // right cluster
          { x: 670, w: 95, h: 130, winColor: '#ffc04d', roofDiyas: true },
          { x: 780, w: 80, h: 95, winColor: '#ffb300', roofDiyas: false },
          { x: 875, w: 105, h: 140, winColor: '#ffd966', roofDiyas: true }
        ];

        // draw each building
        buildings.forEach(b => {
          const baseY = GROUND_Y;
          const topY = baseY - b.h;

          // main building body (warm dark tone)
          ctx.fillStyle = '#272b36';
          ctx.shadowColor = '#00000055';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 3;
          ctx.beginPath();
          ctx.roundRect(b.x, topY, b.w, b.h, 8);
          ctx.fill();

          // subtle outline
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
          ctx.strokeStyle = '#5e4b2b';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // windows (glowing)
          const cols = Math.max(2, Math.floor(b.w / 28));
          const rows = Math.max(2, Math.floor(b.h / 35));
          const winW = 16;
          const winH = 22;
          const gapX = (b.w - cols * winW) / (cols + 1);
          const gapY = (b.h - rows * winH) / (rows + 1);

          ctx.shadowBlur = 14;
          ctx.shadowColor = '#ffbb33';

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const winX = b.x + gapX + c * (winW + gapX);
              const winY = topY + gapY + r * (winH + gapY);
              // some windows are lit, some dim (random pattern)
              const isLit = ((r * 7 + c * 5 + b.x) % 7) < 5;  // 5/7 lit
              if (isLit) {
                ctx.fillStyle = b.winColor;
                ctx.globalAlpha = 0.95;
              } else {
                ctx.fillStyle = '#3a3f4b';
                ctx.globalAlpha = 0.5;
              }
              ctx.beginPath();
              ctx.roundRect(winX, winY, winW, winH, 4);
              ctx.fill();
            }
          }

          // reset shadow/alpha
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1.0;

          // if building has rooftop diyas (small flames)
          if (b.roofDiyas) {
            const diyaY = topY - 8;
            const diyaCount = Math.floor(b.w / 30);
            for (let d = 0; d < diyaCount; d++) {
              const diyaX = b.x + 15 + d * 28;
              // clay diya (small pot)
              ctx.fillStyle = '#b45f2b';
              ctx.shadowBlur = 12;
              ctx.shadowColor = '#ff8c42';
              ctx.beginPath();
              ctx.ellipse(diyaX, diyaY + 4, 7, 3, 0, 0, Math.PI * 2);
              ctx.fill();
              // flame
              ctx.fillStyle = '#ffb347';
              ctx.shadowColor = '#ffaa33';
              ctx.shadowBlur = 18;
              ctx.beginPath();
              ctx.moveTo(diyaX - 3, diyaY);
              ctx.quadraticCurveTo(diyaX, diyaY - 12, diyaX + 3, diyaY);
              ctx.fill();
              // inner flame
              ctx.fillStyle = '#fff7b0';
              ctx.shadowBlur = 12;
              ctx.beginPath();
              ctx.moveTo(diyaX - 1.5, diyaY - 1);
              ctx.quadraticCurveTo(diyaX, diyaY - 8, diyaX + 1.5, diyaY - 1);
              ctx.fill();
            }
          }
        });

        // extra ground-level diyas (candles) at doorsteps / street
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffaa33';

        // ground diya positions
        const groundDiyas = [
          55, 150, 245, 310, 395, 480, 540, 610, 690, 740, 830, 920, 960
        ];
        groundDiyas.forEach((x, idx) => {
          const baseY = GROUND_Y + 6;
          // tiny clay bowl
          ctx.fillStyle = '#b45f2b';
          ctx.shadowBlur = 14;
          ctx.shadowColor = '#ff8c42';
          ctx.beginPath();
          ctx.ellipse(x, baseY - 2, 8, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          // flame
          ctx.fillStyle = '#ffb347';
          ctx.shadowBlur = 22;
          ctx.shadowColor = '#ffaa33';
          ctx.beginPath();
          ctx.moveTo(x - 4, baseY - 6);
          ctx.quadraticCurveTo(x, baseY - 18, x + 4, baseY - 6);
          ctx.fill();
          ctx.fillStyle = '#fff7b0';
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.moveTo(x - 2, baseY - 8);
          ctx.quadraticCurveTo(x, baseY - 16, x + 2, baseY - 8);
          ctx.fill();

          // tiny reflection on ground
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 0.2;
          ctx.fillStyle = '#ffbb33';
          ctx.beginPath();
          ctx.ellipse(x, baseY + 4, 14, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        });

        // reset shadow
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      // ---------- floating candle / diya lights (animated) ----------
      // store floating diya state
      const floatingDiyas = [];
      const FLOATING_COUNT = 14;

      function initFloatingDiyas() {
        for (let i = 0; i < FLOATING_COUNT; i++) {
          floatingDiyas.push({
            x: Math.random() * W,
            y: 60 + Math.random() * (GROUND_Y - 180), // stay above buildings mostly
            radius: 4 + Math.random() * 6,
            speedY: 0.2 + Math.random() * 0.4,
            speedX: (Math.random() - 0.5) * 0.25,
            phase: Math.random() * Math.PI * 2,
            glowIntensity: 0.7 + Math.random() * 0.5,
          });
        }
      }
      initFloatingDiyas();

      // ---------- update & draw floating diyas (animated) ----------
      function drawFloatingDiyas(time) {
        ctx.shadowBlur = 25;
        floatingDiyas.forEach(d => {
          // gentle floating motion
          d.y -= d.speedY * 0.6;  // slow upward drift
          d.x += d.speedX * 0.4 + Math.sin(time * 0.002 + d.phase) * 0.2;

          // wrap around: if goes too high, reset to bottom area (above homes but below sky)
          if (d.y < 30) {
            d.y = GROUND_Y - 120 - Math.random() * 70;
            d.x = Math.random() * W;
          }
          if (d.x < -20) d.x = W + 20;
          if (d.x > W + 20) d.x = -20;

          // draw glowing diya / floating lamp
          const flicker = 0.8 + 0.4 * Math.sin(time * 0.01 + d.phase);
          const rad = d.radius * (0.9 + 0.2 * Math.sin(time * 0.02 + d.phase));

          // outer glow (big)
          ctx.globalAlpha = 0.35 + 0.15 * flicker;
          ctx.shadowColor = '#ffaa33';
          ctx.shadowBlur = 28;
          ctx.fillStyle = '#ffb347';
          ctx.beginPath();
          ctx.arc(d.x, d.y, rad * 2.4, 0, Math.PI * 2);
          ctx.fill();

          // main flame / lamp body
          ctx.globalAlpha = 0.95;
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#ff8c42';
          ctx.fillStyle = '#ffaa33';
          ctx.beginPath();
          ctx.arc(d.x, d.y, rad * 0.9, 0, Math.PI * 2);
          ctx.fill();

          // inner bright core
          ctx.globalAlpha = 1.0;
          ctx.shadowBlur = 16;
          ctx.fillStyle = '#fff7b0';
          ctx.beginPath();
          ctx.arc(d.x - rad * 0.2, d.y - rad * 0.2, rad * 0.55, 0, Math.PI * 2);
          ctx.fill();

          // tiny sparkles
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = '#fff0b0';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(d.x + rad * 0.8, d.y - rad * 0.6, rad * 0.2, 0, Math.PI * 2);
          ctx.fill();
        });

        // reset
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
      }

      // ---------- draw light rays / festive glow (subtle animated) ----------
      function drawAmbientGlow(time) {
        // soft glow near ground (from diyas)
        const groundGlow = ctx.createRadialGradient(W/2, GROUND_Y-40, 50, W/2, GROUND_Y, 400);
        groundGlow.addColorStop(0, 'rgba(255, 180, 70, 0.08)');
        groundGlow.addColorStop(0.7, 'rgba(255, 140, 40, 0.02)');
        groundGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = groundGlow;
        ctx.fillRect(0, GROUND_Y-100, W, 200);

        // moving light specks (like fireflies / tiny diyas)
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ffbb33';
        for (let i = 0; i < 12; i++) {
          const angle = time * 0.0005 + i * 0.9;
          const x = W/2 + Math.sin(angle) * (W*0.45) + Math.cos(i*2.3) * 60;
          const y = GROUND_Y - 80 + Math.cos(angle * 1.7) * 50 + Math.sin(i*1.8) * 20;
          const size = 1.8 + Math.sin(time*0.01 + i)*1.2;
          ctx.globalAlpha = 0.5 + 0.3 * Math.sin(time*0.02 + i);
          ctx.fillStyle = '#ffd966';
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
      }

      // ---------- utility for rounded rectangles ----------
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };

      // ---------- animation loop ----------
      let startTime = performance.now();

      function animate(now) {
        const time = now - startTime;

        // 1. sky & static stars (redraw each frame – stars static)
        drawSky();

        // 2. ambient background glow (animated softly)
        drawAmbientGlow(time);

        // 3. draw homes & buildings (static but with glow)
        drawHomes();

        // 4. floating diyas (animated)
        drawFloatingDiyas(time);

        // 5. extra: subtle moving light streaks (like string lights)
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#ffb347';
        ctx.lineWidth = 1.2;
        for (let s = 0; s < 6; s++) {
          const offset = Math.sin(time * 0.002 + s) * 30;
          ctx.beginPath();
          ctx.moveTo(0, 120 + s * 40 + offset);
          ctx.lineTo(W, 100 + s * 35 - offset * 0.5);
          ctx.strokeStyle = `rgba(255, 180, 70, ${0.06 + 0.03 * Math.sin(time*0.005 + s)})`;
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;

        requestAnimationFrame(animate);
      }

      // start animation
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
