
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali City Simulator</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

/* =========================
   GLOBAL DESIGN
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #050817;
    font-family: Arial, sans-serif;
    user-select: none;
    touch-action: none;
}

#game-container {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================
   GAME HUD
========================= */

#game-ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

#top-bar {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.game-logo {
    color: white;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px #ff8c00;
}

#location {
    color: #ffe5a0;
    font-size: 12px;
    background: #111827bb;
    border: 1px solid #ffffff25;
    padding: 9px 14px;
    border-radius: 20px;
}

/* =========================
   CONTROL PANEL
========================= */

#controls {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 20px;
}

#movement-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.game-btn {
    pointer-events: auto;
    border: 1px solid #ffffff40;
    background: #18243bcc;
    color: white;
    border-radius: 50%;
    width: 65px;
    height: 65px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(12px);
    box-shadow: 0 5px 20px #0008;
}

.game-btn:active {
    transform: scale(0.91);
    background: #ff8c00;
}

#fire-btn {
    width: 75px;
    height: 75px;
    background: linear-gradient(145deg,#ff9d00,#e83914);
    border: 2px solid #ffcf72;
    font-size: 12px;
}

#camera-btn {
    background: #25334ccc;
}

/* =========================
   JOYSTICK
========================= */

#joystick {
    pointer-events: auto;
    width: 115px;
    height: 115px;
    border-radius: 50%;
    background: #ffffff20;
    border: 2px solid #ffffff50;
    position: relative;
    touch-action: none;
    backdrop-filter: blur(5px);
}

#joystick-knob {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #ffffffcc;
    border: 3px solid white;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 3px 15px #0008;
}

/* =========================
   GAME MESSAGE
========================= */

#message {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827cc;
    color: #ffe5a0;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:600px) {

    .game-logo {
        font-size: 15px;
    }

    #location {
        font-size: 10px;
    }

    #controls {
        padding: 0 12px;
        bottom: 20px;
    }

    #joystick {
        width: 105px;
        height: 105px;
    }

    #joystick-knob {
        width: 45px;
        height: 45px;
    }

    .game-btn {
        width: 55px;
        height: 55px;
    }

    #fire-btn {
        width: 68px;
        height: 68px;
    }
}

</style>
</head>

<!-- PART 1 ENDS HERE -->

<script>

// ==========================================
// PART 2: DIWALI CITY 3D ENVIRONMENT
// ==========================================

// SCENE
const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080d22);
scene.fog = new THREE.FogExp2(0x080d22, 0.006);

// CAMERA
const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 12);

// RENDERER
const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

document.getElementById("game-container")
    .appendChild(renderer.domElement);

// ==========================================
// LIGHTING
// ==========================================

const ambientLight = new THREE.AmbientLight(
    0x8090c0,
    0.65
);

scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(
    0xb4caff,
    1.1
);

moonLight.position.set(-20, 35, -20);
moonLight.castShadow = true;
scene.add(moonLight);

const warmLight = new THREE.PointLight(
    0xff9d42,
    2,
    60
);

warmLight.position.set(0, 8, 0);
scene.add(warmLight);

// ==========================================
// MATERIALS
// ==========================================

function material(color, roughness = 0.85) {
    return new THREE.MeshStandardMaterial({
        color: color,
        roughness: roughness
    });
}

const roadMaterial = material(0x252a35);
const footpathMaterial = material(0x777780);
const grassMaterial = material(0x243d2a);

const wallColors = [
    0xd99a75,
    0xe7c28d,
    0xc98b83,
    0xd5d2b8,
    0xaeb8a2,
    0xc9a6d5
];

const lightColors = [
    0xff3232,
    0xffbb33,
    0x33ccff,
    0x55ff99,
    0xff55cc,
    0xffffff
];

// ==========================================
// BASIC OBJECT CREATOR
// ==========================================

function createBox(
    x, y, z,
    width, height, depth,
    mat,
    parent = scene
) {

    const geometry = new THREE.BoxGeometry(
        width, height, depth
    );

    const mesh = new THREE.Mesh(
        geometry,
        mat
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

// ==========================================
// GROUND
// ==========================================

createBox(
    0, -0.35, 0,
    180, 0.5, 180,
    grassMaterial
);

// ==========================================
// ROAD NETWORK
// ==========================================

function createRoad(x, z, width, length, rotation = 0) {

    const road = createBox(
        x, -0.075, z,
        width, 0.12, length,
        roadMaterial
    );

    road.rotation.y = rotation;

    return road;
}

// Main road
createRoad(0, 0, 13, 170);

// Side roads
createRoad(-35, 0, 9, 170);
createRoad(35, 0, 9, 170);

// Cross streets
createRoad(0, -40, 170, 9);
createRoad(0, 40, 170, 9);
createRoad(0, 0, 100, 9);

// ==========================================
// ROAD MARKINGS
// ==========================================

const whiteRoad = material(0xd8d8d8);

for (let z = -75; z < 80; z += 9) {

    createBox(
        0, 0.002, z,
        0.18, 0.025, 4,
        whiteRoad
    );

}

// ==========================================
// FOOTPATHS
// ==========================================

function createSidewalk(x, z, width, length) {

    createBox(
        x, 0.05, z,
        width, 0.35, length,
        footpathMaterial
    );

}

for (let z = -75; z <= 75; z += 1) {

    createSidewalk(-9, z, 2, 1);
    createSidewalk(9, z, 2, 1);

    createSidewalk(-40, z, 2, 1);
    createSidewalk(-30, z, 2, 1);

    createSidewalk(30, z, 2, 1);
    createSidewalk(40, z, 2, 1);

}

// ==========================================
// BUILDING WINDOWS
// ==========================================

const windowMaterial = new THREE.MeshStandardMaterial({
    color: 0xffd27a,
    emissive: 0xff9d32,
    emissiveIntensity: 1.4
});

const darkWindow = material(0x26364b);

function createWindows(
    parent,
    width,
    height,
    floors
) {

    const columns = Math.max(
        2,
        Math.floor(width / 2.5)
    );

    for (let floor = 0; floor < floors; floor++) {

        for (let col = 0; col < columns; col++) {

            const wx =
                -width / 2 +
                (col + 0.5) * width / columns;

            const wy = 1.5 + floor * 3;

            const windowMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.85, 1.25, 0.12),
                Math.random() > 0.25
                    ? windowMaterial
                    : darkWindow
            );

            windowMesh.position.set(
                wx,
                wy,
                0.56
            );

            parent.add(windowMesh);

        }

    }

}

// ==========================================
// DIWALI LIGHT STRINGS
// ==========================================

function createLightString(parent, width, y) {

    const count = Math.floor(width * 3);

    for (let i = 0; i < count; i++) {

        const x = -width / 2 + (i / count) * width;

        const color = lightColors[
            Math.floor(Math.random() * lightColors.length)
        ];

        const bulbMaterial = new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 2
        });

        const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.10, 8, 8),
            bulbMaterial
        );

        bulb.position.set(x, y, 0.7);

        parent.add(bulb);

    }

}

// ==========================================
// CREATE INDIAN HOUSES
// ==========================================

function createHouse(x, z, floors = 2) {

    const house = new THREE.Group();

    const width = 8 + Math.random() * 4;
    const height = floors * 3.2;

    const wall = material(
        wallColors[
            Math.floor(Math.random() * wallColors.length)
        ]
    );

    // Main building
    createBox(
        0, height / 2, 0,
        width, height, 7,
        wall,
        house
    );

    // Roof
    createBox(
        0, height + 0.25, 0,
        width + 0.7, 0.5, 7.7,
        material(0x594c48),
        house
    );

    // Windows
    createWindows(
        house,
        width - 1,
        height,
        floors
    );

    // Main door
    createBox(
        0, 1.2, 3.57,
        1.6, 2.4, 0.15,
        material(0x593526),
        house
    );

    // Door decoration
    createBox(
        0, 2.5, 3.68,
        2, 0.12, 0.12,
        material(0xffcf64),
        house
    );

    // Balcony on upper floors
    if (floors > 1) {

        for (let floor = 1; floor < floors; floor++) {

            createBox(
                0,
                floor * 3.2 + 0.15,
                4,
                width * 0.65,
                0.15,
                1,
                material(0xb7a99b),
                house
            );

            createBox(
                0,
                floor * 3.2 + 0.65,
                4.4,
                width * 0.65,
                0.9,
                0.1,
                material(0x655c57),
                house
            );

        }

    }

    // Diwali lights
    createLightString(
        house,
        width,
        height - 0.2
    );

    // Position house
    house.position.set(x, 0, z);

    scene.add(house);

    return house;

}

// ==========================================
// CITY BUILDINGS
// ==========================================

// Residential buildings on both sides

for (let z = -65; z <= 65; z += 18) {

    createHouse(-17, z, 1 + Math.floor(Math.random() * 3));
    createHouse(17, z, 1 + Math.floor(Math.random() * 3));

    createHouse(-47, z, 1 + Math.floor(Math.random() * 3));
    createHouse(47, z, 1 + Math.floor(Math.random() * 3));

}

// ==========================================
// STREET LAMPS
// ==========================================

function createStreetLamp(x, z) {

    const poleMaterial = material(0x252b36);

    // Pole
    createBox(
        x, 3, z,
        0.18, 6, 0.18,
        poleMaterial
    );

    // Lamp arm
    createBox(
        x + 0.7, 5.8, z,
        1.5, 0.15, 0.15,
        poleMaterial
    );

    // Bulb
    const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 12, 12),
        new THREE.MeshBasicMaterial({
            color: 0xffd68a
        })
    );

    bulb.position.set(x + 1.3, 5.6, z);

    scene.add(bulb);

    // Light source
    const lampLight = new THREE.PointLight(
        0xffbd69,
        2,
        18
    );

    lampLight.position.set(x + 1.3, 5.4, z);

    scene.add(lampLight);

}

for (let z = -70; z <= 70; z += 20) {

    createStreetLamp(-11, z);
    createStreetLamp(11, z);

}

// ==========================================
// TREES
// ==========================================

function createTree(x, z) {

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.4, 3, 8),
        material(0x62402a)
    );

    trunk.position.set(x, 1.5, z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(2, 10, 10),
        material(0x17633c)
    );

    leaves.position.set(x, 4, z);
    leaves.scale.set(1, 1.3, 1);

    scene.add(leaves);

}

for (let z = -65; z <= 65; z += 22) {

    createTree(-24, z);
    createTree(24, z);

}

// ==========================================
// DIYA DECORATION
// ==========================================

function createDiya(x, z) {

    const bowl = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 12, 8),
        material(0xc66a26)
    );

    bowl.scale.y = 0.4;
    bowl.position.set(x, 0.18, z);

    scene.add(bowl);

    const flame = new THREE.Mesh(
        new THREE.ConeGeometry(0.09, 0.35, 8),
        new THREE.MeshBasicMaterial({
            color: 0xffa52e
        })
    );

    flame.position.set(x, 0.38, z);
    scene.add(flame);

    const diyaLight = new THREE.PointLight(
        0xff9b34,
        0.8,
        4
    );

    diyaLight.position.set(x, 0.5, z);
    scene.add(diyaLight);

}

for (let z = -65; z <= 65; z += 10) {

    createDiya(-10.2, z);
    createDiya(10.2, z);

}

// ==========================================
// MOON
// ==========================================

const moon = new THREE.Mesh(
    new THREE.SphereGeometry(5, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0xffe6ae
    })
);

moon.position.set(-45, 45, -80);
scene.add(moon);

// ==========================================
// STARS
// ==========================================

const starGeometry = new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 700; i++) {

    starPositions.push(
        (Math.random() - 0.5) * 250,
        15 + Math.random() * 100,
        (Math.random() - 0.5) * 250
    );

}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.35
    })
);

scene.add(stars);

// ==========================================
// PART 2 COMPLETE
// PART 3 WILL ADD PLAYER AND HUMANS
// ==========================================

</script>
</head>
</html>
